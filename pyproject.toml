[project]
name = "igrok-reality"
version = "0.1.0"
description = "Telegram-платформа для 90-дневного геймифицированного квеста"
requires-python = ">=3.11"
dependencies = [
    # Core
    "aiogram>=3.31",
    "fastapi>=0.138",
    "uvicorn[standard]",
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Task queue
    "arq>=0.28",
    "redis>=5.0",
    "apscheduler>=3.11",
    # HTTP
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
