services:
  postgres:
    image: postgres:15-alpine
    # Bind to loopback only — never expose the DB to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: igrok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-igrok}
      POSTGRES_DB: igrok
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igrok"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Bind to loopback only — an internet-exposed Redis without auth
    # is a remote-code-execution vector (replication / cron payloads).
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    command: python -m app.bot.main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  api:
    build: .
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips *
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Only reachable through the nginx reverse proxy on the host.
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
    env_file:
      - .env

  worker:
    build: .
    command: python -m app.worker.main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  scheduler:
    build: .
    command: python -m app.scheduler.main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
  media_data:
